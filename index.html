<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>3D Игра: Собака и Игрушки</title>
    <style>
        body { margin: 0; overflow: hidden; font-family: sans-serif; }
        #info {
            position: absolute;
            top: 10px;
            width: 100%;
            text-align: center;
            color: white;
            font-size: 18px;
            text-shadow: 1px 1px 2px black;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <div id="info">Управление: Стрелки или WASD<br>Собирай игрушки!</div>
    
    <!-- Подключаем Three.js через CDN -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';

        // 1. Сцена, Камера, Рендерер
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87CEEB); // Небо
        scene.fog = new THREE.Fog(0x87CEEB, 10, 50);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 10, 15);
        camera.lookAt(0, 0, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        document.body.appendChild(renderer.domElement);

        // 2. Свет
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
        dirLight.position.set(10, 20, 10);
        dirLight.castShadow = true;
        dirLight.shadow.camera.top = 20;
        dirLight.shadow.camera.bottom = -20;
        dirLight.shadow.camera.left = -20;
        dirLight.shadow.camera.right = 20;
        scene.add(dirLight);

        // 3. Пол (Трава)
        const floorGeometry = new THREE.PlaneGeometry(100, 100);
        const floorMaterial = new THREE.MeshStandardMaterial({ color: 0x4caf50 });
        const floor = new THREE.Mesh(floorGeometry, floorMaterial);
        floor.rotation.x = -Math.PI / 2;
        floor.receiveShadow = true;
        scene.add(floor);

        // 4. Создание Собаки (упрощенная модель из примитивов)
        function createDog() {
            const dogGroup = new THREE.Group();

            // Тело
            const bodyGeo = new THREE.BoxGeometry(1.5, 1, 2.5);
            const bodyMat = new THREE.MeshStandardMaterial({ color: 0x8B4513 }); // Коричневый
            const body = new THREE.Mesh(bodyGeo, bodyMat);
            body.position.y = 1;
            body.castShadow = true;
            dogGroup.add(body);

            // Голова
            const headGeo = new THREE.BoxGeometry(1, 1, 1);
            const head = new THREE.Mesh(headGeo, bodyMat);
            head.position.set(0, 1.8, 1.5);
            head.castShadow = true;
            dogGroup.add(head);

            // Уши
            const earGeo = new THREE.BoxGeometry(0.3, 0.5, 0.5);
            const earL = new THREE.Mesh(earGeo, bodyMat);
            earL.position.set(-0.4, 2.1, 1.5);
            dogGroup.add(earL);
            const earR = new THREE.Mesh(earGeo, bodyMat);
            earR.position.set(0.4, 2.1, 1.5);
            dogGroup.add(earR);

            // Хвост
            const tailGeo = new THREE.BoxGeometry(0.3, 0.3, 1);
            const tail = new THREE.Mesh(tailGeo, bodyMat);
            tail.position.set(0, 1.5, -1.5);
            tail.rotation.x = Math.PI / 4;
            dogGroup.add(tail);

            // Лапы
            const legGeo = new THREE.CylinderGeometry(0.2, 0.2, 1);
            const positions = [
                [-0.5, 0.5, 1], [0.5, 0.5, 1],
                [-0.5, 0.5, -1], [0.5, 0.5, -1]
            ];
            positions.forEach(pos => {
                const leg = new THREE.Mesh(legGeo, bodyMat);
                leg.position.set(...pos);
                leg.castShadow = true;
                dogGroup.add(leg);
            });

            return dogGroup;
        }

        const dog = createDog();
        scene.add(dog);

        // 5. Игрушки
        const toys = [];
        const toyColors = [0xff0000, 0xffff00, 0x0000ff, 0xff00ff];
        
        function createToy(x, z) {
            const geometry = new THREE.SphereGeometry(0.4, 16, 16);
            const material = new THREE.MeshStandardMaterial({ 
                color: toyColors[Math.floor(Math.random() * toyColors.length)],
                roughness: 0.4
            });
            const toy = new THREE.Mesh(geometry, material);
            toy.position.set(x, 0.4, z);
            toy.castShadow = true;
            
            // Анимация вращения
            toy.userData = { 
                rotationSpeed: Math.random() * 0.05 + 0.02,
                bounceOffset: Math.random() * Math.PI,
                initialY: 0.4
            };
            
            scene.add(toy);
            toys.push(toy);
        }

        // Разбрасываем 10 игрушек
        for (let i = 0; i < 10; i++) {
            const x = (Math.random() - 0.5) * 40;
            const z = (Math.random() - 0.5) * 40;
            // Не спавним слишком близко к центру
            if (Math.abs(x) > 2 || Math.abs(z) > 2) {
                createToy(x, z);
            }
        }

        // 6. Управление
        const keys = { w: false, a: false, s: false, d: false, ArrowUp: false, ArrowLeft: false, ArrowDown: false, ArrowRight: false };
        
        window.addEventListener('keydown', (e) => keys[e.key] = true);
        window.addEventListener('keyup', (e) => keys[e.key] = false);

        const speed = 0.15;
        const turnSpeed = 0.08;

        // 7. Игровой цикл
        function animate() {
            requestAnimationFrame(animate);

            // Движение собаки
            let moving = false;
            if (keys.w || keys.ArrowUp) {
                dog.translateZ(speed);
                moving = true;
            }
            if (keys.s || keys.ArrowDown) {
                dog.translateZ(-speed);
                moving = true;
            }
            if (keys.a || keys.ArrowLeft) {
                dog.rotation.y += turnSpeed;
            }
            if (keys.d || keys.ArrowRight) {
                dog.rotation.y -= turnSpeed;
            }

            // Камера следует за собакой
            const relativeCameraOffset = new THREE.Vector3(0, 8, -12);
            const cameraOffset = relativeCameraOffset.applyMatrix4(dog.matrixWorld);
            
            // Плавное слежение камеры
            camera.position.lerp(cameraOffset, 0.1);
            camera.lookAt(dog.position);

            // Анимация игрушек и проверка столкновений
            const time = Date.now() * 0.001;
            for (let i = toys.length - 1; i >= 0; i--) {
                const toy = toys[i];
                
                // Вращение и подпрыгивание
                toy.rotation.y += toy.userData.rotationSpeed;
                toy.position.y = toy.userData.initialY + Math.sin(time * 3 + toy.userData.bounceOffset) * 0.2;

                // Проверка дистанции до собаки
                const dist = dog.position.distanceTo(toy.position);
                if (dist < 1.5) {
                    // "Съели" игрушку
                    scene.remove(toy);
                    toys.splice(i, 1);
                    
                    // Создаем новую в случайном месте, чтобы игра не кончалась
                    const newX = (Math.random() - 0.5) * 40;
                    const newZ = (Math.random() - 0.5) * 40;
                    createToy(newX, newZ);
                }
            }

            renderer.render(scene, camera);
        }

        // Обработка изменения размера окна
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();
    </script>
</body>
</html>
